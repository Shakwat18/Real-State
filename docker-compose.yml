services:
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: real-state-server
    restart: always

  client:
    build:
      context: ./client
      dockerfile: dockerfile
    container_name: real-state-client
    restart: always

  nginx:
    image: nginx
    container_name: real-state-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - client
      - server
    restart: always
  